name: CLI and viewer regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    # Python 3.8 is not distributed for newer Ubuntu runner images.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r server_requirements.txt
      - run: python -m pip check
      # Parser/scanner tests use the real pinned Python code, mocking native I/O.
      - run: python -m pip install --no-deps dfvfs==20220816
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q vmdiff compose_runtime.py config.py server.py backend
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watchAll=false --runInBand
        working-directory: frontend
        env:
          CI: 'true'
      - run: npm run build
        working-directory: frontend
        env:
          CI: 'true'
