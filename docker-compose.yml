version: '3.4'

services:
  vmdiff:
    image: vmdiff/vmdiff
    build:
      context: ./
      dockerfile: ./backend/Dockerfile
    tty: true
    environment:
      DIFF_IGNORE_BINARY: ${DIFF_IGNORE_BINARY:-True}
    env_file:
      - .env
    volumes:
      - ./backend:/backend
      - ./results:$RESULTS_DIR
  memdiff:
    image: vmdiff/memory-processor
    build:
      context: ./
      dockerfile: ./memory-processing/Dockerfile
    env_file:
      - .env
    volumes:
      - ./memory-processing:/memdiff
      - ./memory-processing/volatilitycache:/home/unprivileged/.cache/volatility3
      - ./results:$RESULTS_DIR
  app:
    environment:
      DIFF_IGNORE_BINARY: ${DIFF_IGNORE_BINARY:-True}
    image: vmdiff/vmdiff-app
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    volumes:
      - ./results:$RESULTS_DIR
    ports:
      - "127.0.0.1:5000:5000"
